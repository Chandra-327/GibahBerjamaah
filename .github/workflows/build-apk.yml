name: Build Android APK

on:
  push:
    branches: [ "main", "master", "chandra-327-check-apk-readiness" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Build Web Application
        env:
          VITE_SOCKET_SERVER_URL: https://gibah.purbaya.my.id
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x ./android/gradlew

      - name: Build Debug APK with Gradle
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/gibahberjamaah.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GibahBerjamaah-Interkom-APK
          path: android/app/build/outputs/apk/debug/gibahberjamaah.apk
