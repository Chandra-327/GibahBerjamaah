<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" stroke="#27272a" stroke-width="6" />
  
  <!-- Outer Radio Ring (Radar) -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#22c55e" stroke-opacity="0.25" stroke-width="6" stroke-dasharray="16 12" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#22c55e" stroke-opacity="0.4" stroke-width="4" />

  <!-- Motorbike Helmet / Intercom Silhouette -->
  <g transform="translate(136, 136)" filter="url(#glow)">
    <!-- Helmet dome -->
    <path d="M120,20 C50,20 10,75 10,145 C10,195 40,225 90,230 L160,230 C200,230 230,195 230,145 C230,75 190,20 120,20 Z" fill="#18181b" stroke="url(#neon)" stroke-width="12" stroke-linejoin="round" />
    <!-- Helmet Visor -->
    <path d="M145,80 L55,80 C40,80 32,95 35,115 L45,150 C50,165 65,175 80,175 L160,175 C175,175 190,165 195,150 L205,115 C208,95 200,80 185,80 Z" fill="#000000" stroke="#3b82f6" stroke-width="6" />
    <!-- Visor reflection line -->
    <path d="M60,100 L120,100" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" />
    <!-- Intercom unit on the side with microphone boom -->
    <rect x="-15" y="130" width="22" height="46" rx="8" fill="#22c55e" stroke="#000" stroke-width="3" />
    <!-- Microphone Boom curving forward -->
    <path d="M-5,160 Q10,210 65,215" fill="none" stroke="#22c55e" stroke-width="7" stroke-linecap="round" />
    <!-- Mic foam tip -->
    <circle cx="65" cy="215" r="9" fill="#eab308" />
    <!-- Sound waves emitted from mic -->
    <path d="M80,205 Q90,215 80,225" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" />
    <path d="M92,198 Q106,215 92,232" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" opacity="0.7" />
  </g>
  
  <!-- GPS Pin Indicator Top Right -->
  <g transform="translate(340, 75)">
    <circle cx="20" cy="20" r="16" fill="#ef4444" />
    <circle cx="20" cy="20" r="6" fill="#ffffff" />
    <polygon points="12,32 28,32 20,48" fill="#ef4444" />
  </g>
</svg>
